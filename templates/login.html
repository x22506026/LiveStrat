<!DOCTYPE html>
<html lang="en">
<head>
    <!--sets character encoding for the page-->
    <meta charset="UTF-8">

    <!--page title shown in the browser tab-->
    <title>LiveStrat Login</title>

    <!--loads styles specific to the login page-->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
    <!--container holding the login form-->
    <div class="login-container">
        <!--page heading-->
        <h2>Welcome to LiveStrat</h2>

        <!--login form that submits credentials to the backend-->
        <form action="{{ url_for('login_user') }}" method="POST">
            <!--username input field-->
            <input type="text" placeholder="Username" required>

            <!--password input field-->
            <input type="password" placeholder="Password" required>

            <!--submit button for logging in-->
            <button type="submit">Log In</button>
        </form>

        <!--link to the signup page for new users-->
        <p>No account? 
            <a href="{{ url_for('signup') }}">Sign up</a>
        </p>
    </div>
</body>
</html>
