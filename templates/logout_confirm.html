<!DOCTYPE html>
<html lang="en">
<head>
    <!--sets character encoding for the page-->
    <meta charset="UTF-8">

    <!--page title shown in the browser tab-->
    <title>Sign out | LiveStrat</title>

    <!--loads the base styles used across the app-->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body>
    <!--container for the sign out confirmation content-->
    <div style="padding:32px;">
        <!--page heading-->
        <h1>Sign out</h1>

        <!--confirmation message-->
        <p style="margin-top:8px;">Are you sure you want to sign out?</p>

        <!--action links for confirming or cancelling sign out-->
        <div style="margin-top:16px;">
            <!--link that completes the sign out process-->
            <a href="{{ url_for('logout_confirmed') }}">Yes, sign me out</a>

            <!--visual separator between links-->
            <span style="margin:0 8px;">|</span>

            <!--link to return to the dashboard without signing out-->
            <a href="{{ url_for('dashboard') }}">Cancel</a>
        </div>
    </div>
</body>
</html>
